[package]
name = "notes-core"
version = "0.1.0"
edition = "2021"
authors = ["Denis Evsyukov <https://denis.evsyukov.org>"]
license = "MIT"
publish = false
description = "Shared core of the Notes app: storage, merge, sync"

[lib]
name = "notes_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
argon2 = "0.6"
automerge = "=0.12.0"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
hmac = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.20"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uniffi = "=0.32.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
uuid = { version = "1", features = ["v5", "v7"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# S54: the key derivation costs 64 MiB and three passes by design; unoptimised it
# would take seconds in every test that opens an encrypted storage.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
